name: verify-artifacts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest reproduce/tests -q
      - run: python reproduce/scripts/replay_superflip.py
      - run: sha256sum -c artifacts/checksums.sha256
